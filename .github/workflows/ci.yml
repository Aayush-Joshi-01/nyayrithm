name: CI

# Manual trigger only — run from the Actions tab.
on:
  workflow_dispatch:

jobs:
  # ─── Backend ────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run mypy app/ --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # No services needed: the suite runs on SQLite + an in-memory MongoDB double, a generated
    # RSA key in place of Keycloak, and mocked Celery. See backend/tests/conftest.py.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: pytest --cov=app --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml

  # ─── Frontends ───────────────────────────────────────────────────
  frontend-lint:
    name: ${{ matrix.app }} Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc --noEmit

  # ─── Docker Build ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./backend -t nyayrithm-backend:ci
      - name: Build frontend image
        run: docker build ./frontend --target production -t nyayrithm-frontend:ci
      - name: Build admin image
        run: docker build ./admin --target production -t nyayrithm-admin:ci
      - name: Validate compose files
        run: |
          cp .env.dev .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
