name: Publish Images

# Manual trigger only — run from the Actions tab.
# Deployment itself is `docker compose up -d --build` on the target host (see
# docs/pages/deployment.md). This workflow builds the images and pushes them to GHCR so a
# host can pull instead of building.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to publish"
        required: false
        default: main

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, context: ./backend }
          - { name: frontend, context: ./frontend, target: production }
          - { name: admin, context: ./admin, target: production }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nyayrithm-${{ matrix.name }}:${{ github.sha }}
