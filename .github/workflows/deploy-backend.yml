name: Deploy Backend

# Manual trigger only — run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy"
        required: false
        default: main

jobs:
  deploy:
    name: Build, Push & Deploy Backend
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/nyayrithm-backend:${{ github.sha }}
          docker build ./backend -t $IMAGE
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Terraform Apply
        working-directory: infra/terraform/environments/prod
        env:
          TF_VAR_backend_image: ${{ env.IMAGE }}
        run: |
          terraform init
          terraform apply -auto-approve
