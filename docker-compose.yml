version: "3.9"

# ─────────────────────────────────────────────────────────────
# Nyayrithm — Local Development Stack
#
# Default services: PostgreSQL, Redis, Qdrant, MinIO
# Override via .env:
#   DB_BACKEND=mongodb        → use mongo service instead
#   VECTOR_DB_BACKEND=chroma  → use chroma service instead
#   STORAGE_BACKEND=s3        → point to local MinIO
# ─────────────────────────────────────────────────────────────

services:

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - evidence_storage:/app/storage
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── Celery Worker (evidence + simulation queues) ──────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      -Q evidence,simulation,default
      --concurrency=4
    volumes:
      - ./backend:/app
      - evidence_storage:/app/storage
    env_file: .env
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── Celery Beat (scheduled tasks) ─────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL (default relational DB) ────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nyayrithm
      POSTGRES_USER: nyayrithm
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayrithm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MongoDB (alternative — enable with DB_BACKEND=mongodb) ─
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  # ── Redis (Celery broker + cache) ─────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Qdrant (default vector store) ─────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  # ── Chroma (alternative vector store) ─────────────────────
  chroma:
    image: chromadb/chroma:latest
    profiles: ["chroma"]
    ports:
      - "8001:8001"
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped

  # ── MinIO (local S3-compatible object storage) ─────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  redisdata:
  qdrantdata:
  chromadata:
  miniodata:
  evidence_storage:
