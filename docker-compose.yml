# ─────────────────────────────────────────────────────────────────────────────
# Nyayrithm — production-shaped stack. Docker Compose is the only deployment mechanism.
#
#   docker compose up -d --build
#
# Built images, no bind mounts, no auto-reload, no dev auth bypass, no seeding, only
# the web-facing ports published. Put a TLS-terminating reverse proxy in front of
# frontend (3000), admin (3001), backend (8000) and keycloak (8080).
#
# Local development uses the overlay as well:   make dev
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# All configuration comes from .env (see .env.example for production, .env.dev for local).
# ─────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
  MONGODB_DB: ${MONGO_DB:-nyayrithm}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_URL: redis://redis:6379/2
  QDRANT_URL: http://qdrant:6333
  # The API fetches Keycloak's signing keys over the Docker network; tokens carry the public URL.
  KEYCLOAK_URL: http://keycloak:8080
  NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
  CORS_ORIGINS: '["${APP_URL}","${ADMIN_URL}"]'
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  APP_URL: ${APP_URL}

services:

  # ── PostgreSQL: relational + transactional state, and Keycloak's own database ───
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/init-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MongoDB: turns, extracted evidence text, LLM usage events ──────────────────
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis: Celery broker + event bus ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Qdrant: vector store ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  # ── Keycloak: identity (login, registration, tokens) ───────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Substituted into the realm's redirect URIs on import.
      APP_URL: ${APP_URL}
      ADMIN_URL: ${ADMIN_URL}
    volumes:
      - ./keycloak/realm-prod.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── One-shot migrations (Postgres schema) ──────────────────────────────────────
  migrate:
    image: nyayrithm-backend:local   # one image shared by migrate, backend and celery_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${BACKEND_EXTRAS:-}   # local-embeddings adds PyTorch (EMBEDDER_BACKEND=sentence-transformers)
    command: alembic upgrade head
    env_file: .env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── Backend API ────────────────────────────────────────────────────────────────
  backend:
    image: nyayrithm-backend:local   # one image shared by migrate, backend and celery_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${BACKEND_EXTRAS:-}   # local-embeddings adds PyTorch (EMBEDDER_BACKEND=sentence-transformers)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/storage
    env_file: .env
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── Celery worker (evidence + simulation queues) ───────────────────────────────
  celery_worker:
    image: nyayrithm-backend:local   # one image shared by migrate, backend and celery_worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${BACKEND_EXTRAS:-}   # local-embeddings adds PyTorch (EMBEDDER_BACKEND=sentence-transformers)
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      -Q evidence,simulation,default
      --concurrency=4
    volumes:
      - evidence_storage:/app/storage
    env_file: .env
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Firm portal ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_WS_URL: ${WS_URL}
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: nyayrithm
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: nyayrithm-app
        NEXT_PUBLIC_DEV_AUTH_MODE: "off"
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASS: ${KEYCLOAK_ADMIN_PASS}
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

  # ── Admin portal (platform operator) ───────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: nyayrithm
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: nyayrithm-admin
        NEXT_PUBLIC_DEV_AUTH_MODE: "off"
    ports:
      - "3001:3001"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

  # ── MinIO: optional S3-compatible evidence storage (docker compose --profile s3 up) ─
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  redisdata:
  qdrantdata:
  miniodata:
  evidence_storage:
