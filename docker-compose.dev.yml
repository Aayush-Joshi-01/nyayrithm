# ─────────────────────────────────────────────────────────────────────────────
# Development overlay. Used by `make dev` / `make dev-creds`; never in production.
#
# Adds: bind mounts + hot reload, Keycloak start-dev with the DEV realm (static accounts),
# Mailpit (catches invite emails), dev data seeding, and published database ports.
#
# Dev auth modes (DEV_AUTH_MODE):
#   open         no login in either portal; the API treats token-less requests as the dev user
#   credentials  real Keycloak login with the static accounts in keycloak/realm-dev.json
# ─────────────────────────────────────────────────────────────────────────────

x-dev-backend: &dev-backend
  APP_ENV: development
  DEBUG: "true"
  SEED_DEV_DATA: "true"
  DEV_AUTH_MODE: ${DEV_AUTH_MODE:-open}
  # Invite emails land in Mailpit: http://localhost:8025
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:

  db:
    ports:
      - "5432:5432"

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"

  keycloak:
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm.json:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  migrate:
    environment:
      <<: *dev-backend

  backend:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - evidence_storage:/app/storage
    environment:
      <<: *dev-backend
    depends_on:
      - mailpit

  celery_worker:
    volumes:
      - ./backend:/app
      - evidence_storage:/app/storage
    environment:
      <<: *dev-backend

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_WS_URL: ${WS_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: nyayrithm
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: nyayrithm-app
      NEXT_PUBLIC_DEV_AUTH_MODE: ${DEV_AUTH_MODE:-open}
      NEXT_PUBLIC_DEV_ACCOUNTS: ${DEV_ACCOUNTS_HINT:-}

  admin:
    build:
      target: dev
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: nyayrithm
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: nyayrithm-admin
      NEXT_PUBLIC_DEV_AUTH_MODE: ${DEV_AUTH_MODE:-open}
      NEXT_PUBLIC_DEV_ACCOUNTS: ${DEV_ACCOUNTS_HINT:-}
